name: Release

# Creates a GitHub release after every merged pull request into main.
#
# Version bump is taken from the pull request labels:
#   major       -> X+1.0.0
#   minor       -> X.Y+1.0
#   (none)      -> X.Y.Z+1
#   no-release  -> no release for this pull request
# The first release is 0.1.0.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case ",$LABELS," in
              *,major,*) next="$((major + 1)).0.0" ;;
              *,minor,*) next="${major}.$((minor + 1)).0" ;;
              *)         next="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Last release: ${last:-none}, next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "hellOS $VERSION" \
            --generate-notes \
            build/libs/*.jar
